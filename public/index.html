<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Ejercicios Java</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .container { display: flex; gap: 20px; }
    .sidebar { width: 30%; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .main { width: 70%; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    ul { list-style: none; padding: 0; }
    li { padding: 8px; margin-bottom: 5px; background: #eee; cursor: pointer; border-radius: 4px; }
    li:hover { background: #ddd; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
    button:hover { background: #218838; }
    .feedback { margin-top: 15px; padding: 10px; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h1>Plataforma de Prácticas Java</h1>
  <div class="container">
    <div class="sidebar">
      <h3>Ejercicios</h3>
      <ul id="lista-ejercicios">Cargando...</ul>
    </div>

    <div class="main">
      <h2 id="titulo">Selecciona un ejercicio</h2>
      <p id="descripcion"></p>
      
      <textarea id="codigo" placeholder="Escribe tu solución en Java aquí..."></textarea><br><br>
      <button onclick="evaluarCodigo()">Enviar Solución</button>

      <div id="resultado"></div>
    </div>
  </div>

  <script>
    let ejercicioActualId = null;

    // Cargar la lista de ejercicios al iniciar
    async function cargarEjercicios() {
      const res = await fetch('/api/ejercicios');
      const data = await res.json();
      const lista = document.getElementById('lista-ejercicios');
      lista.innerHTML = '';
      data.forEach(ej => {
        const li = document.createElement('li');
        li.textContent = `${ej.id}. ${ej.titulo} (${ej.dificultad})`;
        li.onclick = () => seleccionarEjercicio(ej.id);
        lista.appendChild(li);
      });
    }

    // Cargar el ejercicio seleccionado
    async function seleccionarEjercicio(id) {
      ejercicioActualId = id;
      const res = await fetch(`/api/ejercicios/${id}`);
      const ej = await res.json();
      document.getElementById('titulo').textContent = ej.titulo;
      document.getElementById('descripcion').textContent = ej.descripcion;
      document.getElementById('codigo').value = ej.plantilla_codigo;
      document.getElementById('resultado').innerHTML = '';
    }

    // Enviar código para evaluar
    async function evaluarCodigo() {
      if (!ejercicioActualId) return alert('Selecciona un ejercicio primero.');
      
      const codigoAlumno = document.getElementById('codigo').value;
      const resContainer = document.getElementById('resultado');
      resContainer.innerHTML = 'Evaluando código...';

      const res = await fetch('/api/evaluar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ejercicioId: ejercicioActualId, codigoAlumno })
      });

      const data = await res.json();
      if (data.exito) {
        resContainer.innerHTML = `<div class="feedback success"><strong>¡Éxito!</strong> ${data.mensaje}</div>`;
      } else {
        resContainer.innerHTML = `
          <div class="feedback error">
            <strong>Error (${data.tipoError}):</strong>
            <pre>${data.consola}</pre>
            <hr>
            <strong>Pista / Feedback de la IA:</strong>
            <p>${data.feedbackIA}</p>
          </div>`;
      }
    }

    cargarEjercicios();
  </script>
</body>
</html>
